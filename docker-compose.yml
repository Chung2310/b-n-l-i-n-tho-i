version: '3.8'

services:
  igen-erp:
    image: ghcr.io/${IMAGE_NAME:-chung2310/b-n-l-i-n-tho-i}:${IMAGE_TAG:-develop}
    container_name: ${CONTAINER_NAME:-igen-erp}
    restart: always
    ports:
      - "${PORT:-3011}:${PORT:-3011}"
    environment:
      PORT: ${PORT:-3011}
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    networks:
      - default_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default_network:
    external: true
