name: CD (Continuous Deployment)

on:
  push:
    branches: [ develop, main ]

jobs:
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Build functions
        run: npm run build --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Enable Cloud Billing API
        run: gcloud services enable cloudbilling.googleapis.com --project=igen-25811

      - name: Deploy rules and functions
        run: |
          firebase deploy --only firestore:rules,storage,functions

  deploy-docker-vps:
    name: Build Docker & Deploy VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH to VPS
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            TARGET_DIR="/opt/igen-erp/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="igen-erp-staging"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo file .env trống nếu chưa có để tránh lỗi docker compose
            if [ ! -f .env ]; then
              touch .env
            fi

            # Ghi đè file docker-compose.yml động
            cat << EOF > docker-compose.yml
version: '3.8'

services:
  igen-erp:
    image: ghcr.io/chung2310/igen-erp:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - erpnet

networks:
  erpnet:
    driver: bridge
EOF

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image mới và khởi động lại container tương ứng
            docker compose pull
            docker compose up -d --remove-orphans
