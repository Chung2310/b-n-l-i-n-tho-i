name: CI/CD Pipeline

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

# Tự động hủy pipeline cũ nếu có commit mới được push, tránh tình trạng run cũ hoàn thành sau và ghi đè phiên bản mới
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # BƯỚC 1: KIỂM TRA CHẤT LƯỢNG CODE (Chạy cho cả Push và Pull Request)
  ci-checks:
    name: Step 1 - Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline --no-progress

      - name: Type check
        run: yarn typecheck

      - name: Inventory regression tests
        run: yarn test:inventory

      # Chỉ build thử trên PR để bắt lỗi build (vite/esbuild) trước khi merge.
      # Khi push thì bỏ qua vì Step 2 đã build trong Docker rồi — tránh build trùng
      - name: Build check (PR only)
        if: github.event_name == 'pull_request'
        run: yarn build

  # BƯỚC 2: BUILD DOCKER IMAGE (Chỉ chạy khi push/merge và Step 1 thành công)
  build-image:
    name: Step 2 - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.event_name == 'push'
    timeout-minutes: 30
    outputs:
      image-name: ${{ steps.image.outputs.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tên image trên registry bắt buộc viết thường; github.repository có chữ hoa
      - name: Set lowercase image name
        id: image
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Giải phóng ~25-30GB dung lượng runner (xóa toolchain không dùng đến)
      # để BuildKit đủ chỗ build image + chuẩn bị cache export
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache trên GHCR (không tính vào giới hạn 10GB GHA cache).
          # mode=max: export cả layer của builder stage — yarn.lock không đổi thì
          # lần build sau nhảy qua bước cài node_modules + có thể tái dùng layer build
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Dọn dẹp dung lượng Docker ngay sau khi build/push image xong
      - name: Cleanup build cache
        if: always()
        run: |
          docker builder prune -f
          docker image prune -f

  # BƯỚC 3: DEPLOY VPS (Chỉ chạy khi Step 2 thành công)
  deploy:
    name: Step 3 - Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: build-image
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Triển khai lên Staging (nhánh develop) ---
      - name: Copy docker-compose.yml to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-retail/staging"

      - name: Deploy via SSH to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ needs.build-image.outputs.image-name }}
          ENV_FILE_CONTENT: ${{ vars.ENV_FILE || secrets.ENV_FILE }}
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT,IMAGE_NAME
          script: |
            set -eu
            TARGET_DIR="/opt/igen-retail/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="igen-retail-staging"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Variables (hoặc fallback Secrets) vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            export IMAGE_NAME
            export HOST_PORT="${HOST_PORT:-${PORT:-3011}}"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml pull

            # Khởi động lại container mới (Docker compose tự động recreate và restart với downtime tối thiểu)
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ và build cache
            docker image prune -f
            docker builder prune -f

      # --- Triển khai lên Production (nhánh production) ---
      - name: Copy docker-compose.yml to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST_PROD || secrets.SSH_HOST_PROD }}
          username: ${{ vars.SSH_USER_PROD || secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ vars.SSH_PORT_PROD || secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-retail/production"

      - name: Deploy via SSH to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ needs.build-image.outputs.image-name }}
          ENV_FILE_CONTENT: ${{ vars.ENV_FILE_PROD || secrets.ENV_FILE_PROD }}
        with:
          host: ${{ vars.SSH_HOST_PROD || secrets.SSH_HOST_PROD }}
          username: ${{ vars.SSH_USER_PROD || secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ vars.SSH_PORT_PROD || secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT,IMAGE_NAME
          script: |
            set -eu
            TARGET_DIR="/opt/igen-retail/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="igen-retail-production"
            IMAGE_REF="ghcr.io/$IMAGE_NAME:$IMAGE_TAG"
            previous_image=$(docker inspect --format '{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Variables (hoặc fallback Secrets) vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            export IMAGE_NAME
            df -h /
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml pull
            expected_image=$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")

            # Khởi động lại container mới
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --remove-orphans

            healthy=0
            if [ "$(docker inspect --format '{{.Image}}' "$CONTAINER_NAME")" = "$expected_image" ]; then
              for attempt in $(seq 1 30); do
                if docker exec "$CONTAINER_NAME" node -e 'fetch("http://127.0.0.1:" + (process.env.PORT || "3011") + "/api/v1/health", { signal: AbortSignal.timeout(3000) }).then(async (response) => { const data = await response.json(); if (!response.ok || data.status !== "ok" || !String(data.services?.database).startsWith("online")) process.exit(1); }).catch(() => process.exit(1));'; then
                  healthy=1
                  break
                fi
                sleep 2
              done
            fi
            if [ "$healthy" != 1 ]; then
              echo "Retail health check failed; retaining the previous image."
              if [ -n "$previous_image" ]; then
                docker tag "$previous_image" "$IMAGE_REF"
                IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --no-deps igen-retail
              fi
              exit 1
            fi
            echo "Retail production health check passed."

            if [ -n "$previous_image" ] && [ "$previous_image" != "$expected_image" ]; then
              docker image rm "$previous_image" || echo "Previous image is still referenced; retaining it."
            fi

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ và build cache
            docker image prune -f
            docker builder prune -f
            df -h /
